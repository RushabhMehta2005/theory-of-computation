name: Run Tests

# This ensures the workflow runs whenever a PR is opened or updated
on:
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    # 1. Grab your code from the repository
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. Install Python
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12" # Update this to the version you use

    # 3. Install your project's dependencies
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest
        pip install -r requirements.txt

    # 4. Run the tests in your tests/ directory
    - name: Test with pytest
      run: |
        pytest --verbose --color=yes tests/
